    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="chinese">学中文</span>
                <span class="vietnamese">Học Tiếng Trung Cùng Ngọc Hương</span>
            </h1>
            <p class="subtitle">200 Câu Chuyện Song Ngữ - HSK 3 & HSK 4 ❤️</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm câu chuyện...">

            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">Tất cả</button>

                <button class="filter-btn" data-level="HSK4">HSK 4</button>
                <button class="filter-btn" data-category="daily">Cuộc sống</button>
                <button class="filter-btn" data-category="love">Tình yêu</button>
                <button class="filter-btn" data-category="food">Ẩm thực</button>
                <button class="filter-btn" data-category="travel">Du lịch</button>
                <button class="filter-btn" data-category="work">Công việc</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalStories">200</div>
                <div class="stat-label">Câu chuyện</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="learnedCount">0</div>
                <div class="stat-label">Đã học</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">HSK 3-4</div>
                <div class="stat-label">Trình độ</div>
            </div>
        </div>

        <div class="stories-grid" id="storiesGrid">

    </div>

            </div>
            <div class="modal-body">
                <div class="story-text">
                    <div class="text-section chinese-section">
                        <h3>中文</h3>
                        <p id="modalChinese"></p>
                    </div>
                    <div class="text-section pinyin-section">
                        <h3>Pinyin</h3>
                        <p id="modalPinyin"></p>
                    </div>
                    <div class="text-section vietnamese-section">
                        <h3>Tiếng Việt</h3>
                        <p id="modalVietnamese"></p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="data.js"></script>
