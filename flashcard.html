<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Từ Vựng - 学中文</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="flashcard.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="chinese">学词汇</span>
                <span class="vietnamese">Học Từ Vựng Flashcard</span>
            </h1>
            <div class="nav-links">
                <a href="index.html" class="nav-link">← Về trang chủ</a>
            </div>
        </header>

        <div class="lesson-selector">
            <h3>📚 Chọn Bài Học</h3>
            <div class="lesson-grid" id="lessonGrid">
                <!-- Lessons will be generated here -->
            </div>
        </div>

        <div class="flashcard-controls">
            <div class="filter-section">
                <button class="filter-btn active" data-level="all">Tất cả</button>
                <button class="filter-btn" data-level="HSK3">HSK 3</button>
                <button class="filter-btn" data-level="HSK4">HSK 4</button>
            </div>
            <div class="mode-section">
                <label>
                    <input type="checkbox" id="randomMode"> Ngẫu nhiên
                </label>
                <label>
                    <input type="checkbox" id="autoPlay"> Tự động chuyển (3s)
                </label>
            </div>
        </div>

        <div class="flashcard-stats">
            <div class="stat-item">
                <span class="stat-label">Tổng từ:</span>
                <span class="stat-value" id="totalWords">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Đã học:</span>
                <span class="stat-value" id="learnedWords">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Tiến độ:</span>
                <span class="stat-value" id="progress">0/0</span>
            </div>
        </div>

        <div class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <div class="card-chinese-wrapper">
                            <div class="card-chinese" id="cardChinese">点击开始</div>
                            <button class="speaker-btn" id="speakerBtn" title="Nghe phát âm">🔊</button>
                        </div>
                        <div class="card-pinyin" id="cardPinyin">Diǎnjī kāishǐ</div>
                        <div class="flip-hint">👆 Nhấn để lật thẻ</div>
                    </div>
                    <div class="flashcard-back">
                        <div class="card-vietnamese" id="cardVietnamese">Nhấn để bắt đầu</div>
                        <div class="card-example" id="cardExample"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flashcard-actions">
            <button class="action-btn prev-btn" id="prevCard">
                <span>←</span> Trước
            </button>
            <button class="action-btn know-btn" id="knowBtn">
                ✓ Đã biết
            </button>
            <button class="action-btn next-btn" id="nextCard">
                Sau <span>→</span>
            </button>
        </div>
        
        <div class="review-section">
            <button class="review-btn" id="reviewAll">
                📋 Xem danh sách từ vựng
            </button>
        </div>

        <!-- Vocabulary List Modal -->
        <div class="vocab-modal" id="vocabModal">
            <div class="vocab-modal-content">
                <div class="vocab-modal-header">
                    <h2 id="vocabModalTitle">Danh sách từ vựng</h2>
                    <button class="close-modal-btn" id="closeVocabModal">&times;</button>
                </div>
                <div class="vocab-modal-body" id="vocabModalBody">
                    <!-- Vocabulary list will be generated here -->
                </div>
                <div class="vocab-modal-footer">
                    <button class="modal-action-btn" id="startReview">
                        🎴 Bắt đầu ôn tập
                    </button>
                </div>
            </div>
        </div>

        <div class="keyboard-hints">
            <span>⌨️ Phím tắt:</span>
            <span>Space: Lật thẻ</span>
            <span>←/→: Chuyển thẻ</span>
            <span>P: Phát âm</span>
            <span>K: Đã biết</span>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="flashcard.js"></script>
</body>
</html>
